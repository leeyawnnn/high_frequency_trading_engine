# Build, test, sanitizer, format and lint gates for hft_engine.
#
# Every third-party action is pinned to a commit SHA rather than a tag: a tag
# is mutable, and a supply-chain compromise of a popular action is the most
# likely way CI becomes an attack surface. The comment after each SHA records
# which release it corresponds to.
name: ci

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build + test matrix.
  #
  # The engine's Linux-only code paths (pthread_setaffinity_np, the UDP feed)
  # are compiled for the first time here: development happened on macOS/ARM, so
  # the `#if defined(__linux__)` branches had never been through a compiler.
  # ---------------------------------------------------------------------------
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        exclude:
          # `gcc` on a macOS runner is a shim for AppleClang, so this leg would
          # silently duplicate the clang leg instead of testing GCC.
          - os: macos-latest
            compiler: gcc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc"  >> "$GITHUB_ENV"
            echo "CXX=g++"  >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Record toolchain
        run: |
          cmake --version | head -1
          $CXX --version | head -1
          echo "nproc: $(getconf _NPROCESSORS_ONLN)"

      # -march=native is the project default because it is required for honest
      # latency numbers, but it is wrong for CI: the runner fleet is
      # heterogeneous, so a native build tests whichever microarchitecture the
      # job happened to land on and can emit instructions the next runner
      # lacks. Correctness gates build portable; measurement runs keep native.
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DHFT_NATIVE=OFF \
            -DHFT_LTO=${{ matrix.build_type == 'Release' && 'ON' || 'OFF' }} \
            -DHFT_WERROR=ON

      - name: Build
        run: cmake --build build -j "$(getconf _NPROCESSORS_ONLN)"

      # An explicit per-test timeout on top of the one in tests/CMakeLists.txt:
      # a hung test must fail the job, never hang it until the 6-hour job cap.
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  # ---------------------------------------------------------------------------
  # ASan + UBSan. Non-hot-path only: the sanitizer runtimes make latency
  # measurement meaningless, so benchmarks and tools are excluded.
  # ---------------------------------------------------------------------------
  sanitize:
    name: asan+ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHFT_NATIVE=OFF -DHFT_SANITIZE=ON -DHFT_WERROR=ON \
            -DHFT_BUILD_BENCHMARKS=OFF -DHFT_BUILD_TOOLS=OFF -DHFT_BUILD_APPS=OFF
      - name: Build
        run: cmake --build build -j "$(getconf _NPROCESSORS_ONLN)"
      - name: Test
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build --output-on-failure --timeout 300

  # ---------------------------------------------------------------------------
  # ThreadSanitizer. This exists primarily for the lock-free SPSC queue: a
  # memory-ordering bug there is invisible to every other gate in this file.
  # ---------------------------------------------------------------------------
  tsan:
    name: tsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHFT_NATIVE=OFF -DHFT_TSAN=ON -DHFT_WERROR=ON \
            -DHFT_BUILD_BENCHMARKS=OFF -DHFT_BUILD_TOOLS=OFF -DHFT_BUILD_APPS=OFF
      - name: Build
        run: cmake --build build -j "$(getconf _NPROCESSORS_ONLN)"
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure --timeout 300

  # ---------------------------------------------------------------------------
  # Style and lint. Both tools are installed from PyPI at a pinned version:
  # the distro package tracks whatever LLVM the runner image ships, and a
  # runner image bump would otherwise show up as a formatting failure on code
  # nobody touched.
  # ---------------------------------------------------------------------------
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - run: pip install --quiet clang-format==23.1.1
      - name: Check formatting
        run: git ls-files '*.hpp' '*.cpp' | xargs clang-format --dry-run --Werror

  # ---------------------------------------------------------------------------
  # libFuzzer. The property tests drive the book with generators I wrote, so
  # they explore the input space I thought of; this explores the one I did not.
  # Short runs on every push: enough to catch a regression, not a fuzzing
  # campaign. Apple's Command Line Tools clang ships no fuzzer runtime, so this
  # can only run on Linux.
  # ---------------------------------------------------------------------------
  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHFT_BUILD_FUZZERS=ON -DHFT_NATIVE=OFF -DHFT_LTO=OFF \
            -DHFT_BUILD_TESTS=OFF -DHFT_BUILD_BENCHMARKS=OFF \
            -DHFT_BUILD_TOOLS=OFF -DHFT_BUILD_APPS=OFF
      - name: Build
        run: cmake --build build-fuzz -j "$(getconf _NPROCESSORS_ONLN)"
      - name: Fuzz the order book
        run: ./build-fuzz/fuzz/fuzz_book -max_total_time=45 -print_final_stats=1
      - name: Fuzz the ITCH reader
        run: ./build-fuzz/fuzz/fuzz_itch -max_total_time=45 -print_final_stats=1

  # ---------------------------------------------------------------------------
  # Figures must regenerate from the committed CSVs. A figure that silently
  # stops rendering is how a README ends up citing a chart nobody can rebuild.
  # ---------------------------------------------------------------------------
  figures:
    name: figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install --quiet 'matplotlib==3.8.2'
      - name: Render figures from committed data
        run: python3 reports/plot.py
      - name: Re-render tables and fail if they drift from the CSVs
        run: |
          python3 tools/render_tables.py
          git diff --exit-code -- reports/tables.md || {
            echo "::error::reports/tables.md is stale. Run tools/render_tables.py and commit."
            exit 1
          }
      - name: Fail if any figure is missing or empty
        run: |
          for f in reports/figures/*.svg; do
            [ -s "$f" ] || { echo "::error::$f is empty"; exit 1; }
          done
          echo "all figures rendered"

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - run: pip install --quiet clang-tidy==22.1.8
      - name: Configure (compile_commands.json only)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHFT_NATIVE=OFF -DHFT_LTO=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Lint
        run: |
          git ls-files '*.cpp' | xargs clang-tidy -p build --warnings-as-errors='*'
